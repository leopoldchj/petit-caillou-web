name: Frontend tests

on:
  push:
  pull_request:
  workflow_call: {}

jobs:
  test:
    name: lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b type-checks the project, then vite builds it. This is the
      # quality gate until a dedicated test runner is added.
      - name: Build
        run: npm run build
